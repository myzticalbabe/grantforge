[project]
name = "grantforge"
version = "2.0.1"
description = "AI-native grant tooling: discover → assess → draft → review → collaborate → export → submit"
readme = "README.md"
authors = [{name = "Azazael"}]
license = {text = "CDDL-1.1"}
requires-python = ">=3.13"  # Python 3.14t free-threaded
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "rich>=13.9",
    # Browsing instrument (split out as PROJECT Madi 2026-11-11).
    "madi>=0.1.0",
    
    # AI/ML
    "torch>=2.5",  # With OpenVINO backend
    "openvino>=2024.6",
    "sentence-transformers>=3.2",
    "transformers>=4.45",
    "llama-cpp-python>=0.3.0",
    "marker-pdf>=0.2",  # PDF → Markdown
    "unstructured>=0.16",  # PDF/DOCX parsing with tables/images
    
    # Search/Embedding
    "rank-bm25>=0.2",
    "faiss-cpu>=1.8",  # Or faiss-gpu
    
    # Export
    "reportlab>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    
    # Web/Async
    "httpx>=0.27",
    "aiofiles>=24.1",
    "playwright>=1.46",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx-sse>=0.4",
    
    # Database
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    
    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "email-validator>=2.2",
]

[project.scripts]
# Without this a clean install left no `grantforge` command: the wheel shipped the
# package and nothing that runs it (measured on the 2.0.0 wheel, 2026-11-11).
grantforge = "grantforge.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
browser = [
    # Render rung lives in Madi now (HyperEdgeBrowser.goto/interact).
    # madi[browser] brings Playwright; core madi stays stdlib-only.
    "madi[browser]>=0.1.0",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["grantforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101", "D100"] }  # inline table on one line

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.nuitka]
# Config loaded from grantforge.nuitka.toml
config-file = "grantforge.nuitka.toml"