name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  # The job id IS the check-run name, which is the status-check context that
  # branch protection requires. It was `test`, so the required context `ci` was
  # never produced and main stayed blocked even when the job passed.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pyproject.toml declares requires-python = ">=3.13"; 3.12 could never
          # install the package. 3.13 is what publish.yml and test.yml already use.
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # madi is not on PyPI yet, so the resolver cannot satisfy `madi>=0.1.0`
          # on its own. Install it from its repository first; pip then treats the
          # requirement as met. Same line test.yml uses.
          pip install "git+https://github.com/myzticalbabe/madi.git@v0.1.0"
          if [ -f pyproject.toml ]; then pip install -e .[test] 2>/dev/null || pip install -e .; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest tests/ -v --tb=short; fi
      - name: Type check
        run: |
          if [ -f pyproject.toml ] && grep -q "basedpyright\|pyright" pyproject.toml; then
            pip install basedpyright && basedpyright --version
          fi
